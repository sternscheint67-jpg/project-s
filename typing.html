<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイピング練習">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>タイピング練習</title>
<style>
:root {
  --bg: #f5f5f7;
  --surface: rgba(255,255,255,0.78);
  --surface-solid: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --accent: #0071e3;
  --success: #30b350;
  --danger: #ff3b30;
  --warning-text: #b9650a;
  --hairline: rgba(0,0,0,0.08);
  --fill-quiet: #e8e8ed;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --shadow-card: 0 1px 1px rgba(0,0,0,0.03), 0 10px 26px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.6);
}

* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  background: var(--bg) radial-gradient(1100px 640px at 50% -8%, #e3f0ff 0%, rgba(227,240,255,0) 60%) no-repeat;
  color: var(--text);
  margin: 0;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}

.screen { max-width: 900px; margin: 0 auto; }

h1 { text-align:center; font-size:26px; font-weight:700; letter-spacing:-0.01em; margin:8px 0 6px; }
h2 { font-size:17px; font-weight:600; letter-spacing:-0.01em; margin:0 0 12px; }

button { font-family: inherit; -webkit-tap-highlight-color: transparent; transition: transform 140ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 140ms ease, filter 140ms ease; }
button:active { transform: scale(0.96); }
@media (prefers-reduced-motion: reduce) {
  button:active { transform: none; }
}

.menu-btn, .settings-card, .instruction-card, .practice-stage, .level-btn, .sentence-card, .result-card {
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}

.link-btn { background:none; border:none; color:var(--accent); font-size:15px; font-weight:500; cursor:pointer; padding:8px 4px; }
.link-btn:active { opacity:0.5; transform:none; }

.header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.header-row h1 { flex:1; margin:0; }
.header-spacer { width:64px; }

.menu-list { display:flex; flex-direction:column; gap:12px; max-width:380px; margin:0 auto; }
.menu-btn {
  background:var(--surface); border:none; border-radius:var(--radius-lg); padding:14px 16px;
  font-size:19px; font-weight:600; letter-spacing:0.01em; color:var(--text); cursor:pointer;
  box-shadow:var(--shadow-card); display:flex; align-items:center; justify-content:flex-start; gap:14px;
}
.menu-btn:active { filter:brightness(0.97); }
.menu-icon-badge {
  width:46px; height:46px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.16), inset 0 1px 1px rgba(255,255,255,0.5);
}
.menu-icon-badge svg { width:27px; height:27px; display:block; }
.badge-practice { background:linear-gradient(135deg,#8ec9ff,#3d8bf0); }
.badge-word { background:linear-gradient(135deg,#8fe3c2,#2fb583); }
.badge-sentence { background:linear-gradient(135deg,#ffb8dd,#f2569e); }
.menu-label { flex:1; text-align:left; }
.menu-chevron { color:var(--text-secondary); font-size:20px; opacity:0.45; font-weight:400; }

.settings-card { max-width:380px; margin:22px auto 0; background:var(--surface); border-radius:var(--radius-lg); padding:6px 18px; box-shadow:var(--shadow-card); }
.settings-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; font-size:15px; }
.settings-row:not(:last-child) { border-bottom:1px solid var(--hairline); }
.ios-switch { width:50px; height:30px; border-radius:15px; background:var(--fill-quiet); border:none; position:relative; cursor:pointer; padding:0; flex-shrink:0; transition:background 180ms ease; }
.ios-switch.on { background:var(--success); }
.ios-switch-knob {
  position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%; background:#fff;
  box-shadow:0 3px 6px rgba(0,0,0,0.25); transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1);
}
.ios-switch.on .ios-switch-knob { transform:translateX(20px); }

.instruction-card { background:var(--surface); border-radius:var(--radius-lg); padding:16px 20px; box-shadow:var(--shadow-card); margin-bottom:18px; text-align:center; font-size:14px; line-height:1.9; color:var(--text-secondary); }

.practice-stage { background:var(--surface); border-radius:var(--radius-lg); padding:16px 20px; box-shadow:var(--shadow-card); text-align:center; margin-bottom:12px; }
.practice-row-wrap { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
.practice-row { font-size:48px; font-weight:700; letter-spacing:0.08em; line-height:1; }
.practice-row .ch { transition:color 100ms ease; }
.practice-row .ch.done { color:var(--text-secondary); }
.practice-row .ch.current { color:var(--accent); }
.practice-row .ch.flash-ok { color:var(--success); }
.practice-row .ch.flash-ng { color:var(--danger); }
.speech-bubble {
  position:relative; background:var(--fill-quiet); color:var(--text); border-radius:14px; padding:10px 14px;
  max-width:210px; font-size:13px; line-height:1.5; text-align:left;
}
.speech-bubble::before {
  content:''; position:absolute; left:-8px; top:50%; transform:translateY(-50%);
  border-width:7px 9px 7px 0; border-style:solid; border-color:transparent var(--fill-quiet) transparent transparent;
}
.practice-romaji-hint { margin-top:6px; font-size:16px; letter-spacing:0.1em; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.rep-bar { display:flex; justify-content:center; gap:4px; margin-top:12px; }
.rep-seg { width:20px; height:7px; border-radius:4px; background:var(--fill-quiet); transition:background 120ms ease; }
.rep-seg.filled { background:var(--success); }
.progress-track { height:6px; border-radius:3px; background:var(--fill-quiet); margin-top:10px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 150ms ease; }

.keyboard { max-width:560px; margin:0 auto; user-select:none; }
.kb-row { display:flex; justify-content:center; gap:5px; margin-bottom:5px; }
.kb-key {
  min-width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#fff; opacity:0.55; transition:transform 80ms ease, opacity 80ms ease, box-shadow 80ms ease;
}
.kb-key.active { opacity:1; transform:scale(1.12); box-shadow:0 0 0 3px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.25); }
.kb-key.space { min-width:200px; }
.kb-f-lp { background:#e53e3e; } .kb-f-lr { background:#dd6b20; } .kb-f-lm { background:#d69e2e; } .kb-f-li { background:#38a169; }
.kb-f-ri { background:#3182ce; } .kb-f-rm { background:#5a67d8; } .kb-f-rr { background:#805ad5; } .kb-f-rp { background:#d53f8c; }
.kb-f-th { background:#718096; }

.hands-row { display:flex; justify-content:center; align-items:flex-end; gap:44px; margin-top:12px; }
.hand-block { display:flex; flex-direction:column; align-items:center; }
.hand-fingers { display:flex; align-items:flex-end; gap:3px; }
.hand-finger { width:13px; border-radius:7px 7px 4px 4px; }
.hand-palm { width:84px; height:26px; border-radius:12px 12px 18px 18px; background:var(--fill-quiet); margin-top:-3px; }

.result-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20;
}
.result-overlay[hidden] { display:none; }
.result-card { background:var(--surface); border-radius:var(--radius-lg); padding:30px 28px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow-card); }
.result-grade { font-size:64px; font-weight:800; margin:6px 0 14px; }
.result-grade svg { width:66px; height:66px; margin:0 auto; display:block; }
.result-stats { display:flex; flex-direction:column; gap:8px; font-size:15px; color:var(--text-secondary); margin-bottom:20px; }
.result-stats b { color:var(--text); font-variant-numeric:tabular-nums; }
.result-actions { display:flex; flex-direction:column; gap:10px; }
.btn-primary {
  background:linear-gradient(180deg,#2b96ff,#0071e3); color:#fff; border:none; border-radius:var(--radius-md); padding:13px 0;
  font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 3px 8px rgba(0,113,227,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn-primary:active { filter:brightness(0.95); box-shadow:0 1px 3px rgba(0,113,227,0.3); }
.btn-secondary { background:var(--fill-quiet); color:var(--text); border:none; border-radius:var(--radius-md); padding:13px 0; font-size:15px; font-weight:600; cursor:pointer; }

.stats-row { display:flex; justify-content:center; gap:26px; margin-bottom:14px; font-size:14px; color:var(--text-secondary); }
.stats-row b { color:var(--text); font-variant-numeric:tabular-nums; font-size:16px; }

.lanes-wrap { position:relative; margin-bottom:18px; }
.lanes { position:relative; display:flex; height:420px; background:linear-gradient(#eaf6ff,#f5fbff); border-radius:var(--radius-lg); overflow:hidden; box-shadow:inset 0 0 0 1px var(--hairline); }
.lane { flex:1; position:relative; }
.lane:not(:last-child) { border-right:1px dashed var(--hairline); }
.lane-indicator { position:absolute; top:0; left:10px; right:10px; height:7px; border-radius:0 0 7px 7px; background:var(--fill-quiet); transition:background 150ms ease, box-shadow 150ms ease; z-index:1; }
.lane.selected { background:rgba(0,113,227,0.1); transition:background 150ms ease; }
.lane.selected .lane-indicator { background:var(--accent); box-shadow:0 0 8px rgba(0,113,227,0.6); }
.danger-line { position:absolute; left:0; right:0; bottom:34px; height:2px; background:var(--danger); opacity:0.45; pointer-events:none; }
.octopus { position:absolute; left:50%; top:0; transform:translateX(-50%); text-align:center; white-space:nowrap; }
.octopus.locked .octopus-emoji { filter:drop-shadow(0 0 7px rgba(0,113,227,0.75)); }
.octopus-emoji { width:38px; height:38px; margin:0 auto; }
.octopus-emoji svg { width:100%; height:100%; display:block; }
.octopus-word { font-size:18px; font-weight:700; margin-top:2px; }
.octopus-word .ch { transition:color 80ms ease; }
.octopus-word .ch.done { color:var(--text-secondary); }
.octopus-word .ch.current { color:var(--accent); }
.octopus-word .ch.error-flash { color:var(--danger); }
.octopus.defeated { animation:octoPopOut 220ms ease forwards; }
@keyframes octoPopOut { to { transform:translateX(-50%) scale(1.6); opacity:0; } }
.octopus.escaped { animation:octoSink 320ms ease forwards; }
@keyframes octoSink { to { opacity:0; transform:translateX(-50%) translateY(14px); } }

.level-list { display:flex; flex-direction:column; gap:14px; max-width:420px; margin:0 auto; }
.level-btn {
  background:var(--surface); border:none; border-radius:var(--radius-lg); padding:18px 22px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow-card); display:flex; align-items:center; justify-content:space-between;
}
.level-btn-name { font-size:19px; font-weight:700; }
.level-btn-sub { font-size:13px; color:var(--text-secondary); margin-top:4px; }
.level-btn-best { font-size:22px; font-weight:800; color:var(--accent); }

.sentence-timer-row { display:flex; justify-content:space-between; font-size:14px; color:var(--text-secondary); margin-bottom:10px; padding:0 4px; }
.sentence-timer-row b { color:var(--text); font-variant-numeric:tabular-nums; }
.sentence-card { background:var(--surface); border-radius:var(--radius-lg); padding:26px; box-shadow:var(--shadow-card); margin-bottom:18px; }
.sentence-text { font-size:24px; line-height:2.1; letter-spacing:0.02em; word-break:break-all; }
.sentence-text .ch { transition:color 80ms ease; }
.sentence-text .ch.done { color:var(--text-secondary); }
.sentence-text .ch.current { color:var(--accent); background:rgba(0,113,227,0.1); border-radius:4px; }
.sentence-text .ch.error-flash { color:var(--danger); }
.sentence-text ruby.ch { ruby-position: over; }

@media (max-width: 640px) {
  body { padding:14px; }
  .practice-row { font-size:34px; }
  .practice-row-wrap { gap:10px; }
  .speech-bubble { max-width:160px; font-size:12px; }
  .speech-bubble::before { left:auto; top:-8px; right:50%; transform:translateX(50%) rotate(90deg); }
  .kb-key { min-width:26px; height:32px; font-size:11px; }
  .kb-key.space { min-width:120px; }
  .hands-row { gap:26px; }
  .hand-palm { width:64px; height:20px; }
  .lanes { height:340px; }
  .octopus-emoji { width:28px; height:28px; }
  .octopus-word { font-size:14px; }
  .sentence-text { font-size:19px; line-height:1.9; }
}
</style>
</head>
<body>

<div id="screen-home" class="screen">
  <h1>タイピング<ruby>練習<rt>れんしゅう</rt></ruby></h1>
  <div class="menu-list">
    <button type="button" class="menu-btn practice" data-mode="practice">
      <span class="menu-icon-badge badge-practice" data-icon="keyboard"></span>
      <span class="menu-label"><ruby>練習<rt>れんしゅう</rt></ruby></span>
      <span class="menu-chevron">›</span>
    </button>
    <button type="button" class="menu-btn word" data-mode="word">
      <span class="menu-icon-badge badge-word" data-icon="squid"></span>
      <span class="menu-label"><ruby>単語<rt>たんご</rt></ruby></span>
      <span class="menu-chevron">›</span>
    </button>
    <button type="button" class="menu-btn sentence" data-mode="sentence">
      <span class="menu-icon-badge badge-sentence" data-icon="book"></span>
      <span class="menu-label"><ruby>文章<rt>ぶんしょう</rt></ruby></span>
      <span class="menu-chevron">›</span>
    </button>
  </div>
  <div class="settings-card">
    <h2 style="text-align:center; padding-top:10px;"><ruby>設定<rt>せってい</rt></ruby></h2>
    <div class="settings-row">
      <span>BGM</span>
      <button type="button" id="bgm-toggle" class="ios-switch" role="switch"><span class="ios-switch-knob"></span></button>
    </div>
    <div class="settings-row">
      <span><ruby>効果音<rt>こうかおん</rt></ruby></span>
      <button type="button" id="sfx-toggle" class="ios-switch" role="switch"><span class="ios-switch-knob"></span></button>
    </div>
  </div>
</div>

<div id="screen-practice" class="screen" style="display:none">
  <div class="header-row">
    <button type="button" class="link-btn back-btn" data-target="screen-home">← もどる</button>
    <h1><ruby>練習<rt>れんしゅう</rt></ruby></h1>
    <span class="header-spacer"></span>
  </div>
  <div class="practice-stage">
    <div class="practice-row-wrap">
      <div id="practice-row" class="practice-row">あいうえお</div>
      <div class="speech-bubble">「<ruby>手元<rt>てもと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ないで<ruby>打<rt>う</rt></ruby>とう!」</div>
    </div>
    <div id="practice-romaji-hint" class="practice-romaji-hint">a</div>
    <div id="rep-bar" class="rep-bar"></div>
    <div class="progress-track"><div id="practice-progress-fill" class="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="practice-keyboard" class="keyboard"></div>
  <div class="hands-row" id="hands-row"></div>
</div>

<div id="screen-word" class="screen" style="display:none">
  <div class="header-row">
    <button type="button" class="link-btn back-btn" data-target="screen-home">← もどる</button>
    <h1><ruby>単語<rt>たんご</rt></ruby></h1>
    <span class="header-spacer"></span>
  </div>
  <div class="instruction-card">イカが<ruby>下<rt>した</rt></ruby>に<ruby>着<rt>つ</rt></ruby>く<ruby>前<rt>まえ</rt></ruby>に、ローマ<ruby>字<rt>じ</rt></ruby>で<ruby>退治<rt>たいじ</rt></ruby>しよう!<br>スペースを<ruby>押<rt>お</rt></ruby>してバーを<ruby>移動<rt>いどう</rt></ruby>しよう</div>
  <div class="stats-row">
    <span>スコア <b id="word-score">0</b></span>
    <span>たおした<ruby>数<rt>かず</rt></ruby> <b id="word-defeated-count">0</b></span>
    <span><ruby>残<rt>のこ</rt></ruby>り <b id="word-lives">❤️❤️❤️</b></span>
  </div>
  <div class="lanes-wrap">
    <div id="lanes" class="lanes">
      <div class="lane" data-lane="0"><div class="lane-indicator"></div></div>
      <div class="lane" data-lane="1"><div class="lane-indicator"></div></div>
      <div class="lane" data-lane="2"><div class="lane-indicator"></div></div>
    </div>
    <div class="danger-line"></div>
  </div>
</div>

<div id="screen-sentence-levels" class="screen" style="display:none">
  <div class="header-row">
    <button type="button" class="link-btn back-btn" data-target="screen-home">← もどる</button>
    <h1><ruby>文章<rt>ぶんしょう</rt></ruby></h1>
    <span class="header-spacer"></span>
  </div>
  <div class="instruction-card">
    <ruby>打<rt>う</rt></ruby>ち<ruby>終<rt>お</rt></ruby>わったら、グレーに<ruby>変<rt>か</rt></ruby>わる。<ruby>間違<rt>まちが</rt></ruby>いは<ruby>赤色<rt>あかいろ</rt></ruby>。
  </div>
  <div class="level-list" id="level-list"></div>
</div>

<div id="screen-sentence" class="screen" style="display:none">
  <div class="header-row">
    <button type="button" class="link-btn back-btn" data-target="screen-sentence-levels">← もどる</button>
    <h1 id="sentence-level-title"><ruby>文章<rt>ぶんしょう</rt></ruby></h1>
    <span class="header-spacer"></span>
  </div>
  <div class="sentence-timer-row">
    <span><ruby>文字数<rt>もじすう</rt></ruby> <b id="sentence-progress-count">0</b> / <span id="sentence-total-count">0</span></span>
    <span><ruby>時間<rt>じかん</rt></ruby> <b id="sentence-timer">0.0</b>秒</span>
  </div>
  <div class="sentence-card">
    <div id="sentence-text" class="sentence-text"></div>
  </div>
</div>

<div id="result-overlay" class="result-overlay" hidden>
  <div class="result-card">
    <h2 id="result-title" style="text-align:center;"><ruby>評価<rt>ひょうか</rt></ruby></h2>
    <div id="result-grade" class="result-grade">S</div>
    <div id="result-stats" class="result-stats"></div>
    <div class="result-actions">
      <button type="button" id="result-retry-btn" class="btn-primary">もう<ruby>一度<rt>いちど</rt></ruby></button>
      <button type="button" id="result-back-btn" class="btn-secondary"><ruby>戻<rt>もど</rt></ruby>る</button>
    </div>
  </div>
</div>

<script id="core-logic">
(function(){

var ROMAJI_TABLE = {
  'あ':['a'],'い':['i'],'う':['u'],'え':['e'],'お':['o'],
  'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],
  'さ':['sa'],'し':['si','shi'],'す':['su'],'せ':['se'],'そ':['so'],
  'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'は':['ha'],'ひ':['hi'],'ふ':['hu','fu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
  'わ':['wa'],'を':['wo'],'ん':['nn','n'],
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'ぢ':['ji','di'],'づ':['zu','du'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
  'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
  'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],
  'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
  'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
  'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
  'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
  'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
  'じゃ':['ja','zya'],'じゅ':['ju','zyu'],'じょ':['jo','zyo'],
  'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
  'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo']
};

var YOUON_SMALL = ['ゃ','ゅ','ょ'];
var PUNCT_ROMAJI = { '、': [','], '。': ['.'], '!': ['!'], '?': ['?'], '・': ['/'], 'ー': ['-'] };

var GOJUON = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ',

function buildChunks(text) {
  var chars = Array.from(text);
  var chunks = [];
  var i = 0;
  while (i < chars.length) {
    var c = chars[i];
    if (c === '　' || c === ' ') {
      chunks.push({ kana: c, type: 'skip', options: [] });
      i++;
      continue;
    }
    if (PUNCT_ROMAJI[c]) {
      chunks.push({ kana: c, type: 'punct', options: PUNCT_ROMAJI[c].slice() });
      i++;
      continue;
    }
    if (c === 'っ') {
      chunks.push({ kana: c, type: 'sokuon', options: null });
      i++;
      continue;
    }
    var two = chars[i + 1];
    if (two && YOUON_SMALL.indexOf(two) !== -1 && ROMAJI_TABLE[c + two]) {
      chunks.push({ kana: c + two, type: 'kana', options: ROMAJI_TABLE[c + two].slice() });
      i += 2;
      continue;
    }
    if (ROMAJI_TABLE[c]) {
      chunks.push({ kana: c, type: 'kana', options: ROMAJI_TABLE[c].slice() });
      i++;
      continue;
    }
    chunks.push({ kana: c, type: 'skip', options: [] });
    i++;
  }
  for (var idx = 0; idx < chunks.length; idx++) {
    if (chunks[idx].type === 'sokuon') {
      var next = chunks[idx + 1];
      var consonant = 'q';
      if (next && next.type === 'kana' && next.options.length) {
        consonant = next.options[0].charAt(0);
      }
      chunks[idx].options = [consonant, 'ltu', 'xtu', 'ltsu', 'xtsu'];
    } else if (chunks[idx].type === 'kana' && chunks[idx].kana === 'ん') {
      var next2 = chunks[idx + 1];
      var needsNN = false;
      if (next2 && next2.type === 'kana') {
        var first = next2.options[0].charAt(0);
        if ('aiueoyn'.indexOf(first) !== -1) needsNN = true;
      }
      chunks[idx].options = needsNN ? ['nn'] : ['nn', 'n'];
    }
  }
  return chunks;
}

function skipUntypeable(session) {
  while (session.index < session.chunks.length && session.chunks[session.index].type === 'skip') {
    session.index++;
  }
  if (session.index >= session.chunks.length) session.finished = true;
}

function createSession(text) {
  var session = { chunks: buildChunks(text), index: 0, buffer: '', mistakes: 0, startTime: null, endTime: null, finished: false };
  skipUntypeable(session);
  return session;
}

function handleKey(session, letter) {
  if (session.finished) return { result: 'ignore' };
  if (!session.startTime) session.startTime = Date.now();
  var chunk = session.chunks[session.index];
  var attempt = session.buffer + letter;
  var anyPrefixMatch = chunk.options.some(function(opt) { return opt.indexOf(attempt) === 0; });
  if (!anyPrefixMatch) {
    session.mistakes++;
    return { result: 'miss' };
  }
  session.buffer = attempt;
  var isComplete = chunk.options.indexOf(attempt) !== -1;
  if (isComplete) {
    session.index++;
    session.buffer = '';
    skipUntypeable(session);
    if (session.finished) {
      session.endTime = Date.now();
      return { result: 'complete' };
    }
    return { result: 'advance' };
  }
  return { result: 'partial' };
}

function gradeSession(session) {
  var totalKana = session.chunks.filter(function(c) { return c.type === 'kana' || c.type === 'punct'; }).length;
  var elapsedMs = Math.max((session.endTime || Date.now()) - session.startTime, 1);
  var minutes = elapsedMs / 60000;
  var cpm = totalKana / minutes;
  var accuracy = totalKana > 0 ? totalKana / (totalKana + session.mistakes) : 1;
  var score = cpm * accuracy;
  var grade = score >= 300 ? 'S' : score >= 220 ? 'A' : score >= 150 ? 'B' : score >= 100 ? 'C' : score >= 60 ? 'D' : 'E';
  return {
    cpm: Math.round(cpm),
    accuracy: Math.round(accuracy * 100),
    grade: grade,
    elapsedSec: Math.round(elapsedMs / 100) / 10,
    mistakes: session.mistakes
  };
}

  [{t:'明日',r:'あした'},{t:'は',r:'は'},{t:'友',r:'とも'},{t:'だち',r:'だち'},{t:'と',r:'と'},{t:'公園',r:'こうえん'},{t:'へ',r:'へ'},{t:'行',r:'い'},{t:'きます',r:'きます'},{t:'。',r:'。'}],

  [{t:'電車',r:'でんしゃ'},{t:'に',r:'に'},{t:'のって',r:'のって'},{t:'学校',r:'がっこう'},{t:'へ',r:'へ'},{t:'行',r:'い'},{t:'きます',r:'きます'},{t:'。',r:'。'}],

  [{t:'夏',r:'なつ'},{t:'休',r:'やす'},{t:'みに',r:'みに'},{t:'海',r:'うみ'},{t:'へ',r:'へ'},{t:'行',r:'い'},{t:'くよていです',r:'くよていです'},{t:'。',r:'。'}],
  [{t:'新',r:'あたら'},{t:'しいくつを',r:'しいくつを'},{t:'買',r:'か'},{t:'って',r:'って'},{t:'もらいました',r:'もらいました'},{t:'。',r:'。'}]
];

function shuffled(arr) {
  var copy = arr.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}

function kanaLength(text) {
  return Array.from(text).filter(function(c) { return c !== '　' && c !== ' '; }).length;
}

function sentenceReading(segments) {
  return segments.map(function(seg) { return seg.r; }).join('');
}

function buildSegmentMap(segments) {
  var map = [];
  var offset = 0;
  segments.forEach(function(seg) {
    var count = buildChunks(seg.r).length;
    map.push({ seg: seg, start: offset, end: offset + count });
    offset += count;
  });
  return map;
}

function buildLevelSegments(targetLength) {
  var pool = shuffled(SENTENCE_POOL);
  var result = [];
  var count = 0;
  var i = 0;
  while (count < targetLength) {
    var sentenceSegs = pool[i % pool.length];
    result = result.concat(sentenceSegs);
    count += kanaLength(sentenceReading(sentenceSegs));
    i++;
    if (i > pool.length * 4) break;
  }
  return result;
}

    practiceSession = Core.createSession(currentPracticeRow());
    renderPracticeRow();
    renderRepBar();
    document.getElementById('practice-progress-fill').style.width = Math.round((practiceRowIndex / Core.KANA_ROWS.length) * 100) + '%';
    updatePracticeKeyboardHighlight();
  }
  function renderPracticeRow() {
    var el = document.getElementById('practice-row');
    el.innerHTML = '';
    practiceSession.chunks.forEach(function(chunk, i) {
      var span = document.createElement('span');
      span.className = 'ch' + (i < practiceSession.index ? ' done' : i === practiceSession.index ? ' current' : '');
      span.textContent = chunk.kana;
      el.appendChild(span);
    });
    var currentChunk = practiceSession.chunks[practiceSession.index];
    document.getElementById('practice-romaji-hint').textContent = currentChunk ? currentChunk.options[0] : '';
  }
  function renderRepBar() {
    var bar = document.getElementById('rep-bar');
    bar.innerHTML = '';
    for (var i = 0; i < PRACTICE_TARGET_REPS; i++) {
      var seg = document.createElement('div');
      seg.className = 'rep-seg' + (i < practiceReps ? ' filled' : '');
      bar.appendChild(seg);
    }
  }
  function updatePracticeKeyboardHighlight() {
    var chunk = practiceSession.chunks[practiceSession.index];
    if (!chunk) { highlightKey(document.getElementById('practice-keyboard'), ''); return; }
    var remaining = chunk.options[0].slice(practiceSession.buffer.length);
    highlightKey(document.getElementById('practice-keyboard'), remaining.charAt(0) || '');
  }
  function handlePracticeKeystroke(letter) {
    var charIndex = practiceSession.index;
    var res = Core.handleKey(practiceSession, letter);
    var spans = document.querySelectorAll('#practice-row .ch');
    var typedSpan = spans[charIndex];
    if (res.result === 'miss') {
      playMistake();
      if (typedSpan) {
        typedSpan.classList.add('flash-ng');
        setTimeout(function() { typedSpan.classList.remove('flash-ng'); }, 150);
      }
      return;
    }
    playCorrect();
    if (typedSpan) {
      typedSpan.classList.add('flash-ok');
      setTimeout(function() { typedSpan.classList.remove('flash-ok'); }, 150);
    }
    if (res.result === 'complete') {
      playRepComplete();
      renderPracticeRow();
      practiceReps++;
      renderRepBar();
      if (practiceReps >= PRACTICE_TARGET_REPS) {
        setTimeout(advancePracticeRow, 380);
      } else {
        setTimeout(loadPracticeRow, 260);
      }
      return;
    }
    renderPracticeRow();
    updatePracticeKeyboardHighlight();
  }
  function advancePracticeRow() {
    practiceReps = 0;
    practiceRowIndex++;
    if (practiceRowIndex >= Core.KANA_ROWS.length) {
      playComplete();
      stopPractice();
      showPracticeFinished();
      return;
    }
    playRowComplete();
    loadPracticeRow();
  }
  function setResultStats(html) {
    document.getElementById('result-stats').innerHTML = html;
  }
  function showPracticeFinished() {
    document.getElementById('result-title').innerHTML = '<ruby>練習<rt>れんしゅう</rt></ruby><ruby>完了<rt>かんりょう</rt></ruby>!';
    document.getElementById('result-grade').textContent = '🎉';
    setResultStats('');
    document.getElementById('result-overlay').hidden = false;
    resultRetryAction = function() { document.getElementById('result-overlay').hidden = true; startPractice(); };
    resultBackAction = function() { document.getElementById('result-overlay').hidden = true; goTo('screen-home'); };
  }

  // ---- Word screen: 3-lane falling squid typing game ----
  var LANE_COUNT = 3;
  var START_LIVES = 3;
  var wordActive = false;
  var wordOctopi = [];
  var wordSelectedLane = 0;
  var wordNextId = 1;
  var wordLives = START_LIVES;
  var wordScore = 0;
  var wordDefeated = 0;
  var wordStartTime = null;
  var wordKeyHandler = null;
  var wordSpawnTimer = null;
  var wordRAF = null;
  var wordLastFrameTime = null;

  function startWord() {
    wordActive = true;
    wordOctopi = [];
    wordSelectedLane = 0;
    wordNextId = 1;
    wordLives = START_LIVES;
    wordScore = 0;
    wordDefeated = 0;
    wordStartTime = Date.now();
    clearLaneSquids();
    updateLaneSelectionVisual();
    updateWordStats();
    wordKeyHandler = function(e) {
      if (e.key === ' ') {
        e.preventDefault();
        wordSelectedLane = (wordSelectedLane + 1) % LANE_COUNT;
        updateLaneSelectionVisual();
        refreshTargetVisuals();
        playClick();
        return;
      }
      if (!/^[a-z]$/.test(e.key)) return;
      handleWordKeystroke(e.key);
    };
    document.addEventListener('keydown', wordKeyHandler);
    spawnOctopus();
    scheduleSpawn();
    wordLastFrameTime = performance.now();
    wordRAF = requestAnimationFrame(tickFall);
  }
  function stopWord() {
    wordActive = false;
    if (wordKeyHandler) { document.removeEventListener('keydown', wordKeyHandler); wordKeyHandler = null; }
    if (wordSpawnTimer) { clearTimeout(wordSpawnTimer); wordSpawnTimer = null; }
    if (wordRAF) { cancelAnimationFrame(wordRAF); wordRAF = null; }
    wordOctopi = [];
    clearLaneSquids();
  }
  function clearLaneSquids() {
    document.querySelectorAll('#lanes .octopus').forEach(function(el) { el.remove(); });
  }
  function updateLaneSelectionVisual() {
    document.querySelectorAll('#lanes .lane').forEach(function(lane) {
      lane.classList.toggle('selected', parseInt(lane.dataset.lane, 10) === wordSelectedLane);
    });
  }
  function heartsHtml(lives, total) {
    var s = '';
    for (var i = 0; i < total; i++) s += i < lives ? '❤️' : '🖤';
    return s;
  }
  function updateWordStats() {
    document.getElementById('word-score').textContent = wordScore;
    document.getElementById('word-defeated-count').textContent = wordDefeated;
    document.getElementById('word-lives').textContent = heartsHtml(wordLives, START_LIVES);
  }
  function scheduleSpawn() {
    if (!wordActive) return;
    var delay = Math.max(900, 2600 - wordDefeated * 40);
    wordSpawnTimer = setTimeout(function() { spawnOctopus(); scheduleSpawn(); }, delay);
  }
  function pickLane() {
    var candidates = [];
    for (var l = 0; l < LANE_COUNT; l++) {
      var crowded = wordOctopi.some(function(o) { return o.lane === l && o.y < 18; });
      if (!crowded) candidates.push(l);
    }
    if (!candidates.length) return -1;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  function spawnOctopus() {
    if (!wordActive) return;
    var lane = pickLane();
    if (lane === -1) return;
    var word = Core.randomWord();
    var octo = { id: wordNextId++, lane: lane, word: word, session: Core.createSession(word), y: 0, el: null };
    wordOctopi.push(octo);
    var laneEl = document.querySelector('.lane[data-lane="' + lane + '"]');
    var el = document.createElement('div');
    el.className = 'octopus';
    el.innerHTML = '<div class="octopus-emoji">' + MASCOT_SVG.squid + '</div><div class="octopus-word"></div>';
    laneEl.appendChild(el);
    octo.el = el;
    renderOctopusWord(octo);
    refreshTargetVisuals();
  }
  function renderOctopusWord(octo) {
    var wordEl = octo.el.querySelector('.octopus-word');
    wordEl.innerHTML = '';
    octo.session.chunks.forEach(function(chunk, i) {
      var span = document.createElement('span');
      span.className = 'ch' + (i < octo.session.index ? ' done' : i === octo.session.index ? ' current' : '');
      span.textContent = chunk.kana;
      wordEl.appendChild(span);
    });
  }
  function activeTargetForLane(lane) {
    var inLane = wordOctopi.filter(function(o) { return o.lane === lane; });
    if (!inLane.length) return null;
    inLane.sort(function(a, b) { return b.y - a.y; });
    return inLane[0];
  }
  function refreshTargetVisuals() {
    var target = activeTargetForLane(wordSelectedLane);
    wordOctopi.forEach(function(o) {
      o.el.classList.toggle('locked', !!target && o.id === target.id);
    });
  }
  function removeOctopusEl(o) {
    if (o.el && o.el.parentNode) o.el.parentNode.removeChild(o.el);
  }
  function defeatOctopus(o) {
    wordOctopi = wordOctopi.filter(function(x) { return x.id !== o.id; });
    wordDefeated++;
    wordScore += 10 + o.word.length * 3;
    updateWordStats();
    playComplete();
    o.el.classList.add('defeated');
    setTimeout(function() { removeOctopusEl(o); }, 240);
    refreshTargetVisuals();
  }
  function escapeOctopus(o) {
    wordOctopi = wordOctopi.filter(function(x) { return x.id !== o.id; });
    wordLives--;
    updateWordStats();
    playMistake();
    o.el.classList.add('escaped');
    setTimeout(function() { removeOctopusEl(o); }, 320);
    refreshTargetVisuals();
    if (wordLives <= 0) endWordGame();
  }
  function tickFall(now) {
    if (!wordActive) return;
    var dt = (now - wordLastFrameTime) / 1000;
    wordLastFrameTime = now;
    var speed = Math.min(22, 6 + wordDefeated * 0.15);
    wordOctopi.slice().forEach(function(o) {
      o.y += speed * dt;
      if (o.y >= 92) {
        escapeOctopus(o);
      } else {
        o.el.style.top = o.y + '%';
      }
    });
    wordRAF = requestAnimationFrame(tickFall);
  }
  function handleWordKeystroke(letter) {
    if (!wordActive) return;
    var target = activeTargetForLane(wordSelectedLane);
    if (!target) return;
    var res = Core.handleKey(target.session, letter);
    if (res.result === 'miss') {
      playMistake();
      var errEl = target.el.querySelector('.octopus-word .current');
      if (errEl) {
        errEl.classList.add('error-flash');
        setTimeout(function() { errEl.classList.remove('error-flash'); }, 200);
      }
      return;
    }
    playCorrect();
    renderOctopusWord(target);
    if (res.result === 'complete') defeatOctopus(target);
  }
  function endWordGame() {
    stopWord();
    var survivalSec = Math.round((Date.now() - wordStartTime) / 1000);
    document.getElementById('result-title').innerHTML = '<ruby>単語<rt>たんご</rt></ruby>ゲーム しゅうりょう';
    document.getElementById('result-grade').innerHTML = MASCOT_SVG.squid;
    setResultStats(
      '<span>たおした<ruby>数<rt>かず</rt></ruby>: <b>' + wordDefeated + '</b> <ruby>杯<rt>はい</rt></ruby></span>' +
      '<span>スコア: <b>' + wordScore + '</b></span>' +
      '<span><ruby>生存<rt>せいぞん</rt></ruby><ruby>時間<rt>じかん</rt></ruby>: <b>' + survivalSec + '</b><ruby>秒<rt>びょう</rt></ruby></span>'
    );
    if (!bestGrades.wordScore || wordScore > bestGrades.wordScore) {
      bestGrades.wordScore = wordScore;
      saveBestGrades();
    }
    document.getElementById('result-overlay').hidden = false;
    resultRetryAction = function() { document.getElementById('result-overlay').hidden = true; goTo('screen-word'); startWord(); };
    resultBackAction = function() { document.getElementById('result-overlay').hidden = true; goTo('screen-home'); };
  }

  // ---- Sentence levels ----
  function bestGradeLabel(levelId) {
    return bestGrades['level' + levelId] || '-';
  }
  function renderLevelList() {
    var list = document.getElementById('level-list');
    list.innerHTML = '';
    Core.LEVELS.forEach(function(level) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn';
      var left = document.createElement('div');
      left.innerHTML = '<div class="level-btn-name">' + level.label + '</div><div class="level-btn-sub">' + level.length + '<ruby>文字<rt>もじ</rt></ruby></div>';
      var right = document.createElement('div');
      right.className = 'level-btn-best';
      right.textContent = bestGradeLabel(level.id);
      btn.appendChild(left);
      btn.appendChild(right);
      btn.addEventListener('click', function() {
        playClick();
        goTo('screen-sentence');
        startSentence(level);
      });
      list.appendChild(btn);
    });
  }

  // ---- Sentence typing ----
  var sentenceSession = null;
  var sentenceLevel = null;
  var sentenceSegmentMap = null;
  var sentenceKeyHandler = null;
  var sentenceTimerInterval = null;

  function startSentence(level) {
    sentenceLevel = level;
    document.getElementById('sentence-level-title').innerHTML = level.label;
    var segments = Core.buildLevelSegments(level.length);
    sentenceSession = Core.createSession(Core.sentenceReading(segments));
    sentenceSegmentMap = Core.buildSegmentMap(segments);
    var totalKana = sentenceSession.chunks.filter(function(c) { return c.type === 'kana' || c.type === 'punct'; }).length;
    document.getElementById('sentence-total-count').textContent = totalKana;
    document.getElementById('sentence-progress-count').textContent = 0;
    document.getElementById('sentence-timer').textContent = '0.0';
    renderSentenceDisplay();
    sentenceKeyHandler = function(e) {
      if (!/^[a-z.,!?/-]$/.test(e.key)) return;
      handleSentenceKeystroke(e.key);
    };
    document.addEventListener('keydown', sentenceKeyHandler);
    sentenceTimerInterval = setInterval(updateSentenceTimer, 100);
  }
  function stopSentence() {
    if (sentenceKeyHandler) { document.removeEventListener('keydown', sentenceKeyHandler); sentenceKeyHandler = null; }
    if (sentenceTimerInterval) { clearInterval(sentenceTimerInterval); sentenceTimerInterval = null; }
  }
  function updateSentenceTimer() {
    if (!sentenceSession || !sentenceSession.startTime) return;
    var elapsed = (Date.now() - sentenceSession.startTime) / 1000;
    document.getElementById('sentence-timer').textContent = elapsed.toFixed(1);
  }
  function renderSentenceDisplay() {
    var el = document.getElementById('sentence-text');
    el.innerHTML = '';
    var doneKana = 0;
    sentenceSegmentMap.forEach(function(entry) {
      var seg = entry.seg;
      var isKanji = seg.t !== seg.r;
      var segDone = entry.end <= sentenceSession.index;
      var segCurrent = sentenceSession.index >= entry.start && sentenceSession.index < entry.end;
      if (segDone) {
        for (var idx = entry.start; idx < entry.end; idx++) {
          var c = sentenceSession.chunks[idx];
          if (c.type === 'kana' || c.type === 'punct') doneKana++;
        }
      }
      if (isKanji) {
        var ruby = document.createElement('ruby');
        ruby.className = 'ch' + (segDone ? ' done' : segCurrent ? ' current' : '');
        ruby.appendChild(document.createTextNode(seg.t));
        var rt = document.createElement('rt');
        rt.textContent = seg.r;
        ruby.appendChild(rt);
        el.appendChild(ruby);
      } else {
        for (var i = entry.start; i < entry.end; i++) {
          var chunk = sentenceSession.chunks[i];
          var span = document.createElement('span');
          span.className = 'ch' + (i < sentenceSession.index ? ' done' : i === sentenceSession.index ? ' current' : '');
          span.textContent = chunk.kana;
          el.appendChild(span);
        }
      }
    });
    document.getElementById('sentence-progress-count').textContent = doneKana;
  }
  function handleSentenceKeystroke(letter) {
    var res = Core.handleKey(sentenceSession, letter);
    if (res.result === 'miss') {
      playMistake();
      var errEl = document.querySelector('#sentence-text .ch.current');
      if (errEl) {
        errEl.classList.add('error-flash');
        setTimeout(function() { errEl.classList.remove('error-flash'); }, 200);
      }
      return;
    }
    playCorrect();
    renderSentenceDisplay();
    if (res.result === 'complete') {
      stopSentence();
      playComplete();
      showSentenceResult();
    }
  }
  function showSentenceResult() {
    var grade = Core.gradeSession(sentenceSession);
    document.getElementById('result-title').innerHTML = sentenceLevel.label + ' <ruby>評価<rt>ひょうか</rt></ruby>';
    document.getElementById('result-grade').textContent = grade.grade;
    setResultStats(
      '<span><ruby>速度<rt>そくど</rt></ruby>: <b>' + grade.cpm + '</b> <ruby>字<rt>じ</rt></ruby>/<ruby>分<rt>ぷん</rt></ruby></span>' +
      '<span><ruby>正確率<rt>せいかくりつ</rt></ruby>: <b>' + grade.accuracy + '</b>%</span>' +
      '<span><ruby>時間<rt>じかん</rt></ruby>: <b>' + grade.elapsedSec + '</b><ruby>秒<rt>びょう</rt></ruby></span>'
    );
    var key = 'level' + sentenceLevel.id;
    var prevBest = bestGrades[key];
    if (!prevBest || GRADE_ORDER.indexOf(grade.grade) > GRADE_ORDER.indexOf(prevBest)) {
      bestGrades[key] = grade.grade;
      saveBestGrades();
    }
    document.getElementById('result-overlay').hidden = false;
    resultRetryAction = function() { document.getElementById('result-overlay').hidden = true; goTo('screen-sentence'); startSentence(sentenceLevel); };
    resultBackAction = function() { document.getElementById('result-overlay').hidden = true; goTo('screen-sentence-levels'); };
  }

  var resultRetryAction = null;
  var resultBackAction = null;
  document.getElementById('result-retry-btn').addEventListener('click', function() {
    playClick();
    if (resultRetryAction) resultRetryAction();
  });
  document.getElementById('result-back-btn').addEventListener('click', function() {
    playClick();
    if (resultBackAction) resultBackAction();
  });

  startBGM('screen-home');
})();
</script>

</body>
